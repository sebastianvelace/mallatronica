name: Datos del SIA

# Refreshes data/sia/ from the public SIA course search and proposes the
# change as a pull request. Nothing reaches production until it is merged.
#
# The SIA answers 403 to GitHub-hosted runners (first run, 2026-11-02), so the
# scheduled run only happens when the repository variable SIA_RUNNER names a
# self-hosted runner label (for example a computer on a regular connection).
# Otherwise run `npm run sia:snapshot` locally and open a pull request.
on:
  workflow_dispatch:
  schedule:
    # Mondays 11:17 UTC (06:17 Bogotá).
    - cron: '17 11 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sia-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || vars.SIA_RUNNER != ''
    runs-on: ${{ vars.SIA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar el buscador público del SIA
        run: python3 scripts/sia/snapshot.py --out data/sia/snapshots/latest.json --plan-out data/sia/plan2545.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - name: Validar los datos nuevos
        run: |
          npm test
          npm run build
      - name: Proponer la actualización
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sia-snapshot
          delete-branch: true
          commit-message: 'data: actualizar datos del SIA'
          title: 'Actualización de datos del SIA'
          body: |
            Snapshot automático del buscador público de cursos del SIA (plan 2545, sede Bogotá).

            - `data/sia/snapshots/latest.json`: oferta del periodo (grupos, horarios, cupos) y prerrequisitos.
            - `data/sia/plan2545.json`: materias, créditos, tipologías y prerrequisitos que usa la malla.

            Revisa el diff antes de fusionar: un cambio grande puede indicar que el SIA cambió su página.
          labels: datos-sia
